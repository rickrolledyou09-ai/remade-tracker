<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMade Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F5F0E6; color: #30332E; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-family: 'Crimson Text', serif; font-size: 42px; color: #193D30; margin-bottom: 30px; }
        .card { background: white; padding: 30px; border: 1px solid #E8E4D8; border-radius: 10px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; font-size: 11px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #E8E4D8; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px; }
        button { background: #193D30; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 13px; }
        button:hover { background: #0F2A22; }
        .bag-item { background: #FAFAF8; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #193D30; }
        .bag-item strong { color: #193D30; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
        .message.success { background: #F0F7F4; color: #6B9A7E; border: 1px solid #6B9A7E; }
        .message.error { background: #FDF1ED; color: #C65D47; border: 1px solid #C65D47; }
        .status { font-size: 12px; color: #A7AE98; padding: 10px; background: #FAFAF8; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ReMade Studio</h1>
        
        <div class="status">
            Firebase Status: <span id="fbStatus">Initializing...</span>
        </div>

        <div id="msg"></div>

        <div class="card">
            <h2 style="font-family: 'Crimson Text', serif; font-size: 24px; margin-bottom: 20px;">Create New Bag</h2>
            <form id="bagForm">
                <div class="form-group">
                    <label>Bag Name *</label>
                    <input type="text" id="bagName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="bagDesc" rows="3"></textarea>
                </div>
                <button type="submit">Create Bag</button>
            </form>
        </div>

        <div class="card">
            <h2 style="font-family: 'Crimson Text', serif; font-size: 24px; margin-bottom: 20px;">My Bags</h2>
            <div id="bagsList">Loading...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    
    <script>
        let db = null;

        const firebaseConfig = {
            apiKey: "AIzaSyAosZ98kbQPTtCf_P6U71gmUa-zfyx0p0A",
            authDomain: "remade-studio.firebaseapp.com",
            projectId: "remade-studio",
            storageBucket: "remade-studio.firebasestorage.app",
            messagingSenderId: "890904163393",
            appId: "1:890904163393:web:75ee8d452ba293e94ac2c0"
        };

        console.log('Initializing Firebase...');
        
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            document.getElementById('fbStatus').textContent = '✓ Connected';
            console.log('Firebase initialized successfully');
            loadBags();
        } catch (e) {
            console.error('Firebase error:', e);
            document.getElementById('fbStatus').textContent = '✗ Error: ' + e.message;
        }

        async function loadBags() {
            try {
                const snapshot = await db.collection('bags').get();
                const bags = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const bagsList = document.getElementById('bagsList');
                if (bags.length > 0) {
                    bagsList.innerHTML = bags.map(b => `
                        <div class="bag-item">
                            <strong>${b.name}</strong>
                            <p style="margin-top: 5px; color: #A7AE98; font-size: 13px;">${b.description || 'No description'}</p>
                        </div>
                    `).join('');
                } else {
                    bagsList.innerHTML = '<p style="color: #A7AE98;">No bags yet. Create one to get started!</p>';
                }
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('bagsList').innerHTML = '<p style="color: red;">Error: ' + err.message + '</p>';
            }
        }

        document.getElementById('bagForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const bag = {
                    name: document.getElementById('bagName').value,
                    description: document.getElementById('bagDesc').value,
                    created: new Date()
                };

                console.log('Saving bag:', bag);
                const docRef = await db.collection('bags').add(bag);
                console.log('Bag saved with ID:', docRef.id);

                showMsg('✓ Bag created!', 'success');
                this.reset();
                await loadBags();
            } catch (err) {
                console.error('Save error:', err);
                showMsg('✗ Error: ' + err.message, 'error');
            }
        });

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => msg.innerHTML = '', 3000);
        }
    </script>
</body>
</html>
